# Configuración de nginx para Azure App Service (Linux, PHP 8.x):
# publica la carpeta public de Laravel.
server {
    listen 8080;
    listen [::]:8080;
    root /home/site/wwwroot/public;
    index index.php;
    port_in_redirect off;
    client_max_body_size 2M;

    # Sugerencias de Lighthouse: comprimir el texto y guardar en caché los
    # recursos de Vite, que llevan un hash en el nombre
    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass 127.0.0.1:9000;
        include fastcgi_params;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 60;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
